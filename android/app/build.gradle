plugins {
    id 'com.android.application'
}

android {
    namespace 'com.royalparkcity.filmrecipe'
    compileSdk 34

    defaultConfig {
        applicationId 'com.royalparkcity.filmrecipe'
        minSdk 29
        targetSdk 34
        versionCode((project.findProperty('versionCode') ?: '1') as int)
        versionName '1.0.' + (project.findProperty('versionCode') ?: '0')
    }

    // 개인용으로 직접 설치하는 앱이라 서명 키를 저장소에 함께 둔다 (업데이트 설치가 끊기지 않게 항상 같은 키)
    signingConfigs {
        shared {
            storeFile file('signing.keystore')
            storePassword 'filmrecipe'
            keyAlias 'filmrecipe'
            keyPassword 'filmrecipe'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
